[project]
name = "documint-forma-bot"
version = "1.0.0"
description = "Telegram bot for document ordering (visa, passport, apostille)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.4.1",
    "python-dotenv==1.2.1",
    "SQLAlchemy==2.0.46",
    "psycopg2-binary==2.9.11",
    "requests==2.32.5",
    "PyYAML==6.0.3",
    "asyncpg==0.30.0",
    "aiosqlite==0.21.0",
    "redis==5.0.8",
]

[dependency-groups]
dev = [
    "alembic==1.16.4",
    "bandit==1.7.10",
    "black==24.10.0",
    "flake8==7.1.1",
    "isort==5.13.2",
    "mutatest>=2.0.1",
    "mypy==1.13.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.uv]
# Пакет не является библиотекой — не публикуем на PyPI
package = false

[tool.black]
line-length = 88
exclude = '''
/(
    \.git
  | \.venv
  | __pycache__
  | \.pytest_cache
  | data
)/
'''

[tool.isort]
profile = "black"
line_length = 88
skip = [".venv", ".git", "__pycache__", ".pytest_cache", "data"]


[tool.pytest.ini_options]
markers = [
    "fast: unit tests that run in <1s",
    "slow: integration tests that take >1s",
    "fsm: tests related to FSM state transitions",
    "integration: tests that hit the real database or external API",
    "handlers: tests for bot message/callback handlers",
    "services: tests for service-layer code",
    "utils: tests for utility modules",
    "e2e: end-to-end flow tests",
]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-v --tb=short --cov --cov-report=term-missing --cov-report=html"


[tool.coverage.run]
source = ["handlers", "services", "utils", "db", "templates", "fsm", "keyboards", "config.py", "data"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
]
disable_warnings = ["module-not-imported"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if False:",
    "except ImportError",
    "except Exception as e",
    "logging.getLogger",
]
show_missing = true
skip_covered = false
