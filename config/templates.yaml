# Document templates — editable by business users without touching Python code.
# Each template has: name_*, price_*, fields (list of field definitions).
# Field keys: id, prompt, type, optional (bool), max_length (int).

visa:
  name_ru: "🗺 Визовая анкета"
  name_uk: "🗺 Візова анкета"
  name_en: "🗺 Visa application"
  price_pln: 150
  price_eur: 35
  fields:
    - id: full_name
      prompt: "👤 ФИО (как в паспорте)"
      type: text
      max_length: 255
    - id: birth_date
      prompt: "🎂 Дата рождения (ДД.ММ.ГГГГ)"
      type: date
    - id: passport_number
      prompt: "🛂 Номер паспорта (серия и номер)"
      type: passport_number
      max_length: 30
    - id: destination_country
      prompt: "🌍 Страна назначения (код страны, например PL, RU, RS, AM)"
      type: country_code
      max_length: 2
    - id: purpose
      prompt: "✈️ Цель визита (туризм / бизнес / учёба / другое)"
      type: text
      max_length: 255
  example: "Олена Роменко\n18.11.1996\nFB363261\nPL\ntourism"

passport:
  name_ru: "🛂 Загранпаспорт"
  name_uk: "🛂 Загранпаспорт"
  name_en: "🛂 Foreign passport"
