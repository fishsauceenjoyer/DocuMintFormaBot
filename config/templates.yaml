# Document templates — editable by business users without touching Python code.
# Each template has: name_*, price_*, fields (list of field definitions).
# Field keys: id, prompt, type, optional (bool), max_length (int).

visa:
  name_ru: "🗺 Визовая анкета"
  name_uk: "🗺 Візова анкета"
  name_en: "🗺 Visa application"
  price_pln: 150
  price_eur: 35
  fields:
    - id: full_name
      prompt: "👤 Full name (as in passport)"
      type: text
      max_length: 255
    - id: birth_date
      prompt: "🎂 Date of birth (DD.MM.YYYY)"
      type: date
    - id: passport_number
      prompt: "🛂 Passport number (series & number)"
      type: passport_number
      max_length: 30
    - id: destination_country
      prompt: "🌍 Destination country (country code, e.g. PL, RU, RS, AM)"
      type: country_code
      max_length: 2
    - id: purpose
      prompt: "✈️ Purpose of visit (tourism / business / study / other)"
      type: text
      max_length: 255
  example: "Olena Romenko\n18.11.1996\nFB363261\nPL\ntourism"

