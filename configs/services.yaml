# ============================================
# Services configuration
# ============================================
# Each service defines:
#   - id: unique service identifier
#   - name: localized display names (ru/en/uk)
#   - price: base price (EUR) + optional PLN price + currency
#   - fields: list of input fields
#   - limits: order constraints
#
# Edit this file to add/remove services without touching Python code.

services:
  - id: demo_service
    name:
      ru: "🗺 Визовая анкета"
      en: "🗺 demo_service application"
      uk: "🗺 Візова анкета"
    price:
      base: 35
      pln: 150
      currency: EUR
    fields:
      - id: full_name
        prompt: "👤 ФИО (как в документе)"
        type: text
        max_length: 255
      - id: birth_date
        prompt: "🎂 Дата рождения (ДД.ММ.ГГГГ)"
        type: date
      - id: demo_document_ref
        prompt: "🛂 Номер документа (серия и номер)"
        type: demo_document_ref
        max_length: 30
      - id: destination_country
        prompt: "🌍 Страна назначения (код страны, например PL, RU, RS, AM)"
        type: country_code
        max_length: 2
      - id: purpose
        prompt: "✈️ Цель визита (туризм / бизнес / учёба / другое)"
        type: text
        max_length: 255
    limits:
      max_per_order: 5

  - id: demo_document
    name:
      ru: "🛂 Заграндокумент"
      en: "🛂 Foreign demo_document"
      uk: "🛂 Заграндокумент"
    price:
      base: 45
      pln: 200
      currency: EUR
    fields:
      - id: full_name
        prompt: "👤 ФИО"
        type: text
        max_length: 255
      - id: birth_date
        prompt: "🎂 Дата рождения (ДД.ММ.ГГГГ)"
        type: date
      - id: birth_place
        prompt: "📍 Место рождения"
        type: text
        max_length: 255
      - id: address
        prompt: "🏠 Адрес проживания"
        type: text
        max_length: 255
    limits:
      max_per_order: 5

  - id: demo_check_check
    name:
      ru: "📜 Справка о несудимости"
      en: "📜 demo_check check"
      uk: "📜 Довідка про несудимість"
    price:
      base: 25
      pln: 100
      currency: EUR
    fields:
      - id: full_name
        prompt: "👤 ФИО"
        type: text
        max_length: 255
      - id: birth_date
        prompt: "🎂 Дата рождения (ДД.ММ.ГГГГ)"
        type: date
      - id: birth_place
        prompt: "📍 Место рождения"
        type: text
        max_length: 255
    limits:
      max_per_order: 5

  - id: apostille
    name:
      ru: "📑 Апостиль"
      en: "📑 Apostille"
      uk: "📑 Апостиль"
    price:
      base: 30
      pln: 120
      currency: EUR
    fields:
      - id: full_name
        prompt: "👤 ФИО"
        type: text
        max_length: 255
      - id: document_type
        prompt: "📄 Тип документа для апостиля"
        type: text
        max_length: 255
      - id: issue_date
        prompt: "📅 Дата выдачи (ДД.ММ.ГГГГ)"
        type: date
      - id: issuing_authority
        prompt: "🏛 Орган, выдавший документ"
        type: text
        max_length: 255
    limits:
      max_per_order: 5

  # ── Demo poster services (from business_config_demo.py) ──────────
  - id: poster_terminator1
    name:
      ru: "🎬 Терминатор 1"
      en: "🎬 Terminator 1"
      uk: "🎬 Термінатор 1"
    price:
      base: 10
      pln: 40
      currency: EUR
    fields:
      - id: size
        prompt: "📐 Выберите размер постера"
        type: choice
        choices: ["A4", "A3", "A2"]
      - id: color
        prompt: "🎨 Выберите цветность"
        type: choice
        choices: ["color", "bw"]
      - id: quantity
        prompt: "🔢 Количество экземпляров (1–5)"
        type: integer
