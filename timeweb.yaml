# ============================================
# Timeweb Cloud Apps — конфигурация деплоя
# https://timeweb.cloud/cloud-apps
# ============================================

name: documint-bot

services:
  - name: bot
    type: docker
    # Сборка из Dockerfile в корне репозитория
    build:
      context: .
      dockerfile: Dockerfile
    # Переменные окружения (задаются также в UI Cloud Apps)
    # Значения по умолчанию — заменить на свои
    env:
      # Обязательно: токен бота от @BotFather
      - BOT_TOKEN=your_bot_token_here
      # Обязательно: ваш Telegram username (администратор)
      - ADMIN_USERNAME=your_admin_username
      # Подключение к PostgreSQL (создать БД в разделе "Базы данных" Timeweb)
      - DATABASE_URL=postgresql://user:password@host:5432/dbname
      # Маршрутизация заказов — ID чатов менеджеров
      - ROUTING_SANEPID=-100123456789
      - ROUTING_BHP=-100987654321
      - ROUTING_PSYCHOTESTS=123456789
      - ROUTING_PESEL=-100123456788
      - ROUTING_DEFAULT=555555555
      # Платёжные реквизиты
      - PAYMENT_BLIK=Номер телефона: +48 123 456 789
      - PAYMENT_UAH=ПриватБанк: 5168 7456 1234 5678\nПолучатель: Ivanov Ivan
      - PAYMENT_USDT=TRC20: TXYZ... (кошелек)
    # Порт (не используется для polling, но нужен для healthcheck)
    ports:
      - 8080
    # Рестарт при падении
    restart: unless-stopped