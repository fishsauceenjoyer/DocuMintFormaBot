[mutmut]
# Directories/files to mutate (comma-separated). Start with handlers/ to keep
# mutation runs fast, then expand to services/utils when coverage is higher.
paths_to_mutate = handlers/

# Directory containing the tests that will kill the mutants.
tests_dir = tests/

# Test runner command mutmut uses to verify each mutant.
runner = pytest

# Files/directories to exclude from mutation (regex, comma-separated).
exclude =
    __init__.py
    migrations/
    tests/
    data/
    config.py