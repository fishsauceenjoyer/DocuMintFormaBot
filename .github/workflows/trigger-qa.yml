name: Trigger Isolated QA (repository_dispatch)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  lint-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --disable-pip-version-check \
            flake8 mypy bandit

      - name: Run flake8
        run: |
          flake8 . --exclude=.venv,.git,__pycache__,.pytest_cache,tests,migrations,data,htmlcov,.vscode,.idea

      - name: Run mypy
        run: |
          mypy . --ignore-missing-errors --exclude='\.venv|\.git|__pycache__|\.pytest_cache|tests|migrations|data|htmlcov|\.vscode|\.idea'

      - name: Run bandit
        run: |
          bandit -r . --exclude .venv,.git,__pycache__,.pytest_cache,tests,migrations,data,htmlcov,.vscode,.idea --format json --output bandit-report.json || true

      - name: Dispatch isolated QA suite
        run: |
          gh api \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            /repos/fishsauceenjoyer/DocuMintFormaBot-Tests/dispatches \
            -f event_type="run-isolated-tests" \
            -f client_payload='{"repository":"fishsauceenjoyer/DocuMintFormaBot","ref":"main"}'
        env:
          GH_TOKEN: ${{ secrets.QA_DISPATCH_TOKEN }}
