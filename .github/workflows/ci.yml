name: 🤖 AI-Driven Quality Gates (CI/CD)

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

permissions:
  contents: write
  pages: write

jobs:
  quality_and_security:
    name: 🛡️ Контроль качества и Безопасность
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Клонирование репозитория
        uses: actions/checkout@v5

      - name: ⚡ Установка uv и Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true # Включаем кэширование для молниеносной сборки

      - name: 📦 Синхронизация зависимостей
        run: uv sync

      - name: 🧼 Проверка линтерами (Static Code Analysis)
        run: |
          uv run black --check .
          uv run flake8 .
          uv run mypy --explicit-package-bases --exclude '^tests/' .

      - name: 🕵️‍♂️ Аудит безопасности (Bandit)
        run: uv run bandit -r handlers/ db/ utils/ data/ services/ fsm/ keyboards/ templates/ -f txt

  automated_testing:
    name: 🧪 Тестирование и Покрытие (Pytest)
    needs: quality_and_security # Тесты запустятся только если линтеры и безопасность чисты
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Клонирование репозитория
        uses: actions/checkout@v5

      - name: ⚡ Установка uv и Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 📦 Синхронизация зависимостей
        run: uv sync

      - name: 🟢 Запуск тестов и проверка покрытия (Coverage)
        run: |
          uv run pytest -v --alluredir=allure-results --cov --cov-report=term-missing

      - name: 📊 Сборка Allure отчета
        id: allure-report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          allure_results: allure-results
          allure_report: allure-report
          allure_history: allure-history

      - name: 🚀 Публикация отчета на GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: true  # Сохранять историю отчетов
          user_name: github-actions
          user_email: github-actions@github.com
          github_token: ${{ secrets.GITHUB_TOKEN }}
