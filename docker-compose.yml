# ============================================
# Docker Compose for DocuMintFormaBot
# ============================================

services:
  bot:
    build: .
    container_name: documintformabot
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    volumes:
      # Mount .env file for configuration
      - ./.env:/app/.env:ro
      # Persist SQLite database between restarts (локальная разработка)
      - ./data:/app/data
    environment:
      # Локально используем SQLite (переопределяется на PostgreSQL через .env при деплое)
      - DATABASE_URL=sqlite:///data/bot.db
    # Для локального тестирования с PostgreSQL — раскомментировать:
    # depends_on:
    #   - postgres

  # PostgreSQL for local development (опционально)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: tg-bot-postgres
  #   restart: unless-stopped
