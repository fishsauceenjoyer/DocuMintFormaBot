# ============================================
# Docker Compose for Telegram Bot (tg-bot-freelance2)
# ============================================

version: "3.8"

services:
  bot:
    build: .
    container_name: tg-bot-freelance
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Mount .env file for configuration
      - ./.env:/app/.env:ro
      # Persist SQLite database between restarts
      - ./data:/app/data
      # Mount bot.db from data directory
    environment:
      - DATABASE_URL=sqlite:///data/bot.db
